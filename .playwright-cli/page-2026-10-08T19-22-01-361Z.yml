        - generic [ref=f1e112]:
          - generic [ref=f1e113]:
            - article [ref=f1e114]:
              - paragraph [ref=f1e115]:
                - strong [ref=f1e116]: "Раздел:"
                - text: Базовая логика ·
                - strong [ref=f1e117]: "Модуль 01:"
                - text: Природа и процесс продаж.
              - blockquote [ref=f1e118]:
                - paragraph [ref=f1e119]:
                  - strong [ref=f1e120]: "Результат:"
                  - text: самостоятельно объяснить смысл темы, применить её к анализу ценности для заказчика и показать результат на проверяемом примере.
              - heading "1. Смысл и место в продажах" [level=2] [ref=f1e121]
              - paragraph [ref=f1e122]: Продажа — это согласование полезного обмена, а не техника принуждения. Покупатель сравнивает изменение своей ситуации с деньгами, временем, риском и доступными альтернативами. Продавец помогает сформулировать задачу, проверить соответствие услуги и договориться о понятном следующем шаге.
              - paragraph [ref=f1e123]:
                - strong [ref=f1e124]: "Фокус этого урока — Обмен ценностью: клиентская задача → решение → результат."
                - text: "Разбирай этот пункт как отдельный инструмент: не смешивай его с остальными шагами модуля и не принимай удобный шаблон за доказанный закон продаж. В продаже IT-услуг результат обычно зависит от контекста клиента, состава работ, альтернатив и качества исполнения."
              - heading "Предметное объяснение" [level=3] [ref=f1e125]
              - paragraph [ref=f1e126]: Обмен ценностью означает, что клиент добровольно передаёт ресурсы в обмен на изменение своей ситуации. Определи текущую задачу, альтернативу без покупки, ожидаемый результат и полный расход ресурсов, включая обучение и поддержку. Техническая функция становится ценностью лишь если её можно связать с задачей клиента.
              - heading "Разбор подхода внутри раздела «Базовая логика»" [level=3] [ref=f1e127]
              - paragraph [ref=f1e128]: "На карте ценности всегда заполняй четыре поля: текущая задача, альтернатива без покупки, результат, за который клиент готов платить, и цена перехода. Маркетинг привлекает внимание, продажи помогают согласовать конкретное решение, реклама оплачивает распространение сообщений, поддержка помогает пользоваться купленным. Эти функции соприкасаются, но не подменяют друг друга."
              - heading "2. Разбор составных элементов" [level=2] [ref=f1e129]
              - list [ref=f1e130]:
                - listitem [ref=f1e131]:
                  - strong [ref=f1e132]: "Обмен ценностью: клиентская задача"
                  - text: ": что это означает в реальном решении покупателя; какие факты это подтвердят; какие ограничения не позволяют делать вывод заранее?"
                - listitem [ref=f1e133]:
                  - strong [ref=f1e134]: решение
                  - text: ": что это означает в реальном решении покупателя; какие факты это подтвердят; какие ограничения не позволяют делать вывод заранее?"
                - listitem [ref=f1e135]:
                  - strong [ref=f1e136]: результат
                  - text: ": что это означает в реальном решении покупателя; какие факты это подтвердят; какие ограничения не позволяют делать вывод заранее?"
              - heading "3. Как применять" [level=2] [ref=f1e137]
              - paragraph [ref=f1e138]: "Опиши путь от первого допустимого контакта до передачи результатов. На каждом шаге ответь: что известно клиенту, чего он опасается, какое решение принимает и какая информация поможет ему решить самому. Не смешивай рекламу, поиск лидов, диагностику и исполнение — у них разные критерии успешности."
              - paragraph [ref=f1e139]:
                - strong [ref=f1e140]: "Рабочая последовательность для темы:"
              - list [ref=f1e141]:
                - listitem [ref=f1e142]:
                  - strong [ref=f1e143]: Зафиксировать контекст.
                  - text: "Кому и зачем нужен «Обмен ценностью: клиентская задача → решение → результат» в текущем процессе продажи; что уже известно из сообщения или данных клиента."
                - listitem [ref=f1e144]:
                  - strong [ref=f1e145]: Выбрать предмет решения.
                  - text: "Разделить элементы: Обмен ценностью: клиентская задача → решение → результат. Не подменять конкретное наблюдение общим предположением о бизнесе."
                - listitem [ref=f1e146]:
                  - strong [ref=f1e147]: Сделать проверяемый шаг.
                  - text: Подготовить один вопрос, документ или вариант решения и объяснить покупателю причину.
                - listitem [ref=f1e148]:
                  - strong [ref=f1e149]: Получить обратную связь.
                  - text: Дать собеседнику возможность поправить понимание, отказаться или выбрать иной вариант.
                - listitem [ref=f1e150]:
                  - strong [ref=f1e151]: Зафиксировать итог.
                  - text: Записать, что подтвердилось, что осталось гипотезой и что следует делать дальше.
              - 'heading "4. Прикладной пример: разработка сайта" [level=2] [ref=f1e152]'
              - paragraph [ref=f1e153]: "При продаже сайта владельцу мебельной мастерской недостаточно сообщить «разработаю на React». Нужно понять, зачем клиенту сайт: каталог работ, доверие перед заказом, удобная заявка или снижение повторяющихся вопросов. Если сайт не решает значимой задачи, правильное действие — не навязывать проект."
              - paragraph [ref=f1e154]:
                - strong [ref=f1e155]: "Перенос на тему «Обмен ценностью: клиентская задача → решение → результат»:"
                - text: представь клиента, который общается исключительно в мессенджере. Напиши в одном абзаце, какие факты нужны для решения по этому пункту. Затем подготовь
                - strong [ref=f1e156]: одно
                - text: уточняющее сообщение, позволяющее отличить потребность клиента от собственного предположения. Не требуй созвона.
              - heading "5. Ошибки и границы применения" [level=2] [ref=f1e157]
              - list [ref=f1e158]:
                - listitem [ref=f1e159]:
                  - strong [ref=f1e160]: "Подмена результата термином:"
                  - text: "сказать «мы используем Обмен ценностью: клиентская задача → решение → результат» недостаточно, если неясно, как это помогает конкретному покупателю."
                - listitem [ref=f1e161]:
                  - strong [ref=f1e162]: "Непроверенная причинность:"
                  - text: приписывать клиенту потери, мотивы или ожидаемую прибыль без его данных.
                - listitem [ref=f1e163]:
                  - strong [ref=f1e164]: "Преждевременный рецепт:"
                  - text: выбирать техническое решение до уточнения задачи, ограничений и ответственных.
                - listitem [ref=f1e165]:
                  - strong [ref=f1e166]: "Нарушение границ:"
                  - text: игнорировать отказ, конфиденциальность, законность контакта или правила платформы.
              - heading "6. Самостоятельная отработка" [level=2] [ref=f1e167]
              - paragraph [ref=f1e168]: "Составь мини-документ «Обмен ценностью: клиентская задача → решение → результат» для вымышленной мебельной мастерской. Укажи исходную ситуацию (только наблюдаемые факты), одно правдоподобное затруднение как гипотезу, допустимый письменный вопрос клиенту и два варианта дальнейших действий. Затем объясни, чем выбранный подход отличается от альтернативы «ничего не менять»."
              - paragraph [ref=f1e169]:
                - strong [ref=f1e170]: "Эталонная логика проверки:"
                - text: в работе должны быть явно отделены наблюдение, гипотеза, вопрос, действие и критерий результата. Ответ, где есть только рекламный лозунг или категоричный вывод о потерях клиента, не засчитывается.
              - heading "7. Вопросы для самопроверки" [level=2] [ref=f1e171]
              - list [ref=f1e172]:
                - listitem [ref=f1e173]: "Что конкретно означает «Обмен ценностью: клиентская задача → решение → результат» и как это связано с решением клиента?"
                - listitem [ref=f1e174]: Какие факты нужны для корректного применения?
                - listitem [ref=f1e175]: Как применить инструмент только текстом, без звонка?
                - listitem [ref=f1e176]: Когда от применения следует отказаться?
              - paragraph [ref=f1e177]:
                - strong [ref=f1e178]: "Ориентир ответа:"
                - text: название инструмента должно переводиться в наблюдаемые действия и ограничения; обещания результата требуют данных и договорённости о критериях.
              - heading "8. Критерии освоения" [level=2] [ref=f1e179]
              - list [ref=f1e180]:
                - listitem [ref=f1e181]:
                  - checkbox [disabled] [ref=f1e182]
                  - text: "Могу своими словами объяснить «Обмен ценностью: клиентская задача → решение → результат» без заученного скрипта."
                - listitem [ref=f1e183]:
                  - checkbox [disabled] [ref=f1e184]
                  - text: Могу назвать минимум две реальные ситуации, где это применимо, и одну, где применение ошибочно.
                - listitem [ref=f1e185]:
                  - checkbox [disabled] [ref=f1e186]
                  - text: Могу показать письменный пример для заказчика сайта, отделив факты от предположений.
                - listitem [ref=f1e187]:
                  - checkbox [disabled] [ref=f1e188]
                  - text: Могу объяснить, какие данные нужны, чтобы утверждение было проверяемым.
                - listitem [ref=f1e189]:
                  - checkbox [disabled] [ref=f1e190]
                  - text: Могу самостоятельно выполнить мини-задание ниже и аргументировать результат.
              - heading "9. Материалы для углубления" [level=2] [ref=f1e191]
              - list [ref=f1e192]:
                - listitem [ref=f1e193]:
                  - strong [ref=f1e194]: C02.
                  - link "Sales Process Basics" [ref=f1e195] [cursor=pointer]:
                    - /url: https://trailhead.salesforce.com/content/learn/modules/build-a-sales-process
                  - text: — Короткое введение в процесс и отличие методологии от этапов воронки.
                - listitem [ref=f1e196]:
                  - strong [ref=f1e197]: C01.
                  - link "Inbound Sales Certification" [ref=f1e198] [cursor=pointer]:

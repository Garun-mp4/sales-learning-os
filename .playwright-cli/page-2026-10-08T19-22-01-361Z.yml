                  - text: — Бесплатная программа по identifying/connect/explore/advise; отдельные примеры устных разговоров адаптируются под текст.
                - listitem [ref=f1e199]:
                  - strong [ref=f1e200]: B08.
                  - link "Founding Sales" [ref=f1e201] [cursor=pointer]:
                    - /url: https://www.foundingsales.com/table-of-contents
                  - text: "— Продажи основателя: ICP, поиск первых покупателей, материал для коммерческой системы; открытое оглавление."
